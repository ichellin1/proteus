<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Proteus browser benchmark</title>
    <style>
      body {
        margin: 16px;
        background: #111;
        color: #ddd;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 800px;
      }
      #stage > * {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 800px;
      }
      #css {
        overflow: hidden;
        background: black;
        visibility: hidden;
      }
      #results {
        white-space: pre-wrap;
        background: #1c1c1c;
        padding: 12px;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <p>
      <button id="run" disabled>Run</button>
      <button id="reset" disabled>Start over</button>
      <span id="status">Loading…</span>
    </p>
    <div id="stage">
      <canvas id="proteus"></canvas>
      <canvas id="proteus-rust"></canvas>
      <canvas id="webgl"></canvas>
      <canvas id="canvas2d"></canvas>
      <div id="css"></div>
    </div>
    <pre id="results"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
