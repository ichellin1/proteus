[package]
name = "proteus-host-winit"
description = "Runs a Proteus app in a native desktop window, with winit and wgpu."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Hosts depend on proteus-runtime only — it re-exports wgpu + glam at the
# versions it builds against. winit and pollster are this host's own
# platform concern.
proteus-runtime = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
# DirHostServices::fetch_async fetches URLs on a background thread. ureq is
# blocking, which suits a plain std::thread, and needs no async runtime.
# Pinned to version 2: version 3 reworked the API, and 2 follows redirects
# by default.
ureq = { version = "2" }
