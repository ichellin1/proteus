[package]
name = "proteus-shell-native"
description = "Layer 3: native windowing shell (winit + wgpu)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "proteus"
path = "src/main.rs"

[dependencies]
# M13.4 step 4a: this crate collapsed to a one-line `main()` — window/GPU
# setup, the frame loop, pointer/resize handling, and now video (`.mp4` via
# ffmpeg, moved into proteus-host-winit's own mp4_player module) all live in
# proteus_host_winit::run. All app/UI logic lives in proteus-demo (built
# once, also linked by proteus-shell-web).
proteus-demo = { path = "../proteus-demo" }
proteus-runtime = { path = "../proteus-runtime" }
proteus-host-winit = { path = "../proteus-host-winit" }
log = { workspace = true }
env_logger = { workspace = true }
