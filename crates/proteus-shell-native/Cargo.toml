[package]
name = "proteus-shell-native"
description = "Runs the Proteus reference demo in a desktop window."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# The reference demo, which ships as a web page, not a crate.
publish = false

[[bin]]
name = "proteus"
path = "src/main.rs"

[dependencies]
# Everything but the settings lives elsewhere: the window, GPU, frame loop
# and input in proteus-host-winit, and the demo itself in proteus-demo.
proteus-demo = { workspace = true }
proteus-runtime = { workspace = true }
proteus-host-winit = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
