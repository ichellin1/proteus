[package]
name = "proteus-host-web"
description = "Runs a Proteus app on an HTML canvas with WebGPU or WebGL2, from Rust or TypeScript."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# proteus-runtime for running a Rust app (`run`); it re-exports wgpu and
# glam at the versions it builds against. proteus-sdk-web for running a
# TypeScript app (`mount`). proteus-sdk-web doesn't depend on this crate,
# so it can still be used on its own.
proteus-runtime = { path = "../proteus-runtime" }
proteus-sdk-web = { path = "../proteus-sdk-web" }
# mount() deserializes a partial ProteusConfig from JS.
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Navigator", "DomRect",
    "ResizeObserver", "ResizeObserverEntry", "ResizeObserverBoxOptions", "ResizeObserverOptions",
    "PointerEvent", "EventTarget", "AddEventListenerOptions",
    "VisibilityState", "Request", "RequestInit", "Response",
    "AbortController", "AbortSignal",
] }
js-sys = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
console_error_panic_hook = { workspace = true }

