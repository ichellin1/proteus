[package]
name = "proteus-sdk-web"
description = "WebAssembly bindings that expose proteus-sdk to JavaScript, for the Proteus TypeScript SDK."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
proteus-sdk = { workspace = true }
proteus-ui = { workspace = true }
proteus-render = { workspace = true }
# Logs exceptions thrown by JavaScript callbacks, and lenient DTO fallbacks.
log = { workspace = true }
bevy_ecs = { workspace = true }
glam = { workspace = true }
slotmap = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
# Tests deserialize DTOs from JSON, the shape JavaScript sends.
serde_json = { workspace = true }
