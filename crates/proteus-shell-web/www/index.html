<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proteus — Reference Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #9090a8;
    }

    h1 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0.6;
    }

    canvas {
      display: block;
      /* Matches proteus-shell-native's default window so both shells lay
         out identically at default size. CSS size only — the backing store
         resolution (canvas width/height attrs) is set by proteus-host-web
         itself, at CSS size × devicePixelRatio (M13.2's DPI change). */
      width: 1280px;
      height: 800px;
      image-rendering: pixelated;
    }

    #status {
      margin-top: 16px;
      font-size: 12px;
      opacity: 0.4;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <h1>Proteus · Reference Demo</h1>

  <canvas id="proteus-canvas"></canvas>
  <p id="status">Loading…</p>

  <script type="module">
    // wasm-pack emits the glue module at pkg/proteus_shell_web.js.
    // Run: wasm-pack build crates/proteus-shell-web --target web --out-dir www/pkg
    //
    // M13.2 collapse: canvas/wgpu setup, DPI, resize, Pointer Events,
    // visibility-pause and the render loop itself now live in
    // proteus-host-web/Engine — start() below just fetches assets and hands
    // off to them. What's left here is the M13.4-debt shim: real HLS video
    // playback and the picsum.photos gallery fetch still need JS (fetch,
    // <video>/MediaSource — there's no Rust-side equivalent yet), so this
    // file polls the returned handle once per its own requestAnimationFrame
    // tick, same "polled take" shape Demo's own API already uses. See
    // proteus-shell-web/src/lib.rs's crate doc.
    import init, { start } from './pkg/proteus_shell_web.js';

    async function main() {
      const status = document.getElementById('status');

      try {
        await init();
        status.textContent = 'Loading assets…';

        const handle = await start('proteus-canvas');
        status.textContent = 'Running';
        // Exposed for devtools debugging.
        window.proteusHandle = handle;

        // ── HLS playback (real HLS, not a plain mp4 — see the module doc in
        // the pre-M13.2 shell for why) ──────────────────────────────────────
        //
        // No decode thread here — the browser's own <video> element is the
        // decoder. Rust owns hit-testing, so it signals *when* to start/stop
        // via handle.takePendingVideoStart()/Stop()/Cancel(), polled once per
        // tick(); this side fetches/parses a simple single-rendition (no
        // adaptive bitrate) fMP4 HLS manifest, feeds segments into a <video>
        // element via MediaSource/SourceBuffer, and extracts decoded frames
        // onto an offscreen canvas, pushing the pixels back into wasm via
        // handle.pushVideoFrame(). See videos/make_hls.sh for how the
        // manifests/segments under videos/hls/ were generated.
        const TILE_HLS = [
          { dir: 'videos/hls/tiger',     codecs: 'avc1.64001F,mp4a.40.2' },
          { dir: 'videos/hls/sintel',    codecs: 'avc1.64001F' },
          { dir: 'videos/hls/jellyfish', codecs: 'avc1.64001F' },
        ];

        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.loop = true; // demo playback loops rather than stopping at EOF
        video.style.display = 'none';
        document.body.appendChild(video);

        const frameCanvas = document.createElement('canvas');
        const frameCtx = frameCanvas.getContext('2d', { willReadFrequently: true });

        // Bumped on every start/stop so a stray callback from a video that's
        // no longer current is dropped instead of pushing frames into
        // whatever's playing now. Checked between every `await` in
        // playHls() below, same idiom as fetchGalleryHires's
        // AbortController generation guard.
        let playbackGeneration = 0;
        let hlsAbortController = null;
        let currentObjectUrl = null;

        function pushCurrentFrame() {
          if (frameCanvas.width === 0 || frameCanvas.height === 0) return;
          frameCtx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
          const { data } = frameCtx.getImageData(0, 0, frameCanvas.width, frameCanvas.height);
          handle.pushVideoFrame(data);
        }

        function frameLoop(generation) {
          if (generation !== playbackGeneration || video.paused || video.ended) return;
          pushCurrentFrame();
          if ('requestVideoFrameCallback' in video) {
            video.requestVideoFrameCallback(() => frameLoop(generation));
          } else {
            requestAnimationFrame(() => frameLoop(generation));
          }
        }

        // Minimal single-variant HLS manifest parser — no adaptive bitrate,
        // so there's no master playlist/variant selection to handle, just
        // one #EXT-X-MAP init segment and a flat list of #EXTINF segments.
        function parseHlsManifest(text) {
          const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
          let initUri = null;
          let duration = 0;
          const segmentUris = [];
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (line.startsWith('#EXT-X-MAP:')) {
              const m = line.match(/URI="([^"]+)"/);
              if (m) initUri = m[1];
            } else if (line.startsWith('#EXTINF:')) {
              duration += parseFloat(line.slice('#EXTINF:'.length)) || 0;
              const next = lines[i + 1];
              if (next && !next.startsWith('#')) segmentUris.push(next);
            }
          }
          if (!initUri || segmentUris.length === 0) {
            throw new Error('HLS manifest: missing init segment or media segments');
          }
          return { initUri, segmentUris, duration };
        }

        async function playHls(tileIdx) {
          playbackGeneration++;
          const generation = playbackGeneration;
          const controller = new AbortController();
          hlsAbortController = controller;

          try {
            if (currentObjectUrl) {
              URL.revokeObjectURL(currentObjectUrl);
              currentObjectUrl = null;
            }

            const { dir, codecs } = TILE_HLS[tileIdx];
            const mimeType = `video/mp4; codecs="${codecs}"`;
            if (!('MediaSource' in window) || !MediaSource.isTypeSupported(mimeType)) {
              console.error(`HLS: unsupported mime type for tile ${tileIdx}:`, mimeType);
              return;
            }

            const mediaSource = new MediaSource();
            currentObjectUrl = URL.createObjectURL(mediaSource);
            video.src = currentObjectUrl;

            let metadataReady = false;
            let firstSegmentReady = false;
            let started = false;
            function maybeStart() {
              if (started || !metadataReady || !firstSegmentReady) return;
              if (generation !== playbackGeneration) return;
              // Safari can fire loadedmetadata for an MSE-backed <video>
              // before videoWidth/videoHeight are actually known — bail and
              // let the 'resize' listener below re-drive this once real
              // dimensions land.
              if (!(video.videoWidth > 0 && video.videoHeight > 0)) return;
              started = true;
              frameCanvas.width = video.videoWidth;
              frameCanvas.height = video.videoHeight;
              handle.startVideo(tileIdx, video.videoWidth, video.videoHeight);
              video.play().then(() => frameLoop(generation)).catch(err => {
                console.error('video.play() failed:', err);
              });
            }
            const onMetadataMaybeReady = () => {
              if (generation !== playbackGeneration) return;
              metadataReady = true;
              maybeStart();
            };
            video.addEventListener('loadedmetadata', onMetadataMaybeReady, { once: true });
            video.addEventListener('resize', onMetadataMaybeReady);

            mediaSource.addEventListener('sourceopen', async () => {
              if (generation !== playbackGeneration) return;
              try {
                const sourceBuffer = mediaSource.addSourceBuffer(mimeType);
                const appendBuffer = (bytes) => new Promise((resolve, reject) => {
                  const onUpdateEnd = () => {
                    sourceBuffer.removeEventListener('updateend', onUpdateEnd);
                    resolve();
                  };
                  sourceBuffer.addEventListener('updateend', onUpdateEnd);
                  try {
                    sourceBuffer.appendBuffer(bytes);
                  } catch (e) {
                    sourceBuffer.removeEventListener('updateend', onUpdateEnd);
                    reject(e);
                  }
                });
                const fetchBytes = async (uri) => {
                  const res = await fetch(`${dir}/${uri}`, { signal: controller.signal });
                  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
                  return new Uint8Array(await res.arrayBuffer());
                };

                const manifestRes = await fetch(`${dir}/stream.m3u8`, { signal: controller.signal });
                if (!manifestRes.ok) throw new Error(`${manifestRes.status} ${manifestRes.statusText}`);
                const { initUri, segmentUris, duration } = parseHlsManifest(await manifestRes.text());
                if (generation !== playbackGeneration) return;

                // Safari's play() throws IndexSizeError if MediaSource.duration
                // is still NaN — set it up front from the manifest's #EXTINF sum.
                mediaSource.duration = duration;

                await appendBuffer(await fetchBytes(initUri));
                if (generation !== playbackGeneration) return;

                await appendBuffer(await fetchBytes(segmentUris[0]));
                if (generation !== playbackGeneration) return;
                firstSegmentReady = true;
                maybeStart();

                for (let i = 1; i < segmentUris.length; i++) {
                  if (generation !== playbackGeneration) return;
                  await appendBuffer(await fetchBytes(segmentUris[i]));
                }
                if (generation === playbackGeneration && mediaSource.readyState === 'open') {
                  mediaSource.endOfStream();
                }
              } catch (err) {
                if (err.name !== 'AbortError') {
                  console.error(`HLS playback failed for tile ${tileIdx}:`, err);
                }
              }
            }, { once: true });
          } catch (err) {
            console.error(`HLS setup failed for tile ${tileIdx}:`, err);
          }
        }

        function stopVideo() {
          playbackGeneration++; // invalidates any in-flight frameLoop/playHls callback
          hlsAbortController?.abort();
          video.pause();
        }

        // ── Photo gallery ────────────────────────────────────────────────
        //
        // Rust signals *when* to fetch via handle.takePendingGalleryFetch(),
        // polled once per tick() below. picsum.photos, addressed by a
        // *specific photo id* (https://picsum.photos/id/{id}/{w}/{h}) —
        // see the pre-M13.2 shell's module doc for why not loremflickr.
        const NATURE_PHOTOS = [
          [12, 2500, 1667], [18, 2500, 1667], [54, 3264, 2176], [66, 3264, 2448],
          [108, 2000, 1333], [114, 3264, 2448], [132, 1600, 1066], [162, 1500, 998],
          [168, 1920, 1280], [174, 1600, 589], [198, 3456, 2304], [216, 2500, 1667],
          [222, 1800, 977], [228, 4608, 3456], [282, 5000, 3333], [294, 3753, 2309],
          [300, 4272, 2848], [324, 3888, 2592], [330, 4272, 2848], [378, 5000, 3333],
          [384, 5000, 3333], [426, 4272, 2848], [432, 5000, 3333], [450, 4288, 2848],
          [456, 3823, 2549], [468, 5000, 3337], [474, 4288, 2848], [480, 3888, 2592],
          [492, 5000, 3324], [498, 5000, 3333], [516, 3008, 2000], [558, 4928, 3264],
          [564, 2000, 1333], [570, 2509, 1673], [582, 2509, 1673], [588, 2509, 1673],
          [600, 2509, 1673], [606, 2513, 1670], [612, 2731, 1536], [630, 2517, 1667],
          [648, 2517, 1667], [654, 2509, 1673], [666, 5000, 3333], [678, 4896, 3264],
          [684, 3872, 2178], [702, 5000, 3333], [732, 5000, 3333], [738, 2005, 3000],
          [774, 5000, 3333], [780, 3264, 1830], [798, 4592, 3448], [810, 5000, 3333],
          [846, 4000, 3000], [852, 3212, 2409], [876, 5000, 3338], [888, 5000, 2813],
          [894, 5000, 3333], [906, 3840, 2880], [912, 5000, 3333], [918, 3747, 2489],
          [924, 3000, 2250], [930, 3264, 4912], [960, 3264, 1832], [966, 5000, 3333],
          [984, 4000, 2248], [990, 5000, 3334], [1002, 4312, 2868], [1020, 4288, 2848],
          [1044, 4032, 2268], [1050, 5000, 3333], [1056, 3988, 2720], [1074, 5000, 3333],
        ];

        // Searches a small window of slightly-smaller candidates for the
        // larger axis, picking whichever integer pair's ratio comes closest
        // to the photo's real one — see the pre-M13.2 shell's module doc
        // (id 606/798 vs. 582/630) for why pinning the larger axis exactly
        // isn't always the best approximation. Mirrors
        // proteus-shell-native::gallery_fetch::fetch_dimensions.
        const FETCH_DIMENSIONS_SEARCH_WINDOW = 6;

        function fetchDimensions(aspectW, aspectH, sidePx) {
          const ratio = aspectW / aspectH;
          let best = [sidePx, 1, Infinity];
          for (let delta = 0; delta <= Math.min(FETCH_DIMENSIONS_SEARCH_WINDOW, sidePx - 1); delta++) {
            const larger = sidePx - delta;
            const w = aspectW >= aspectH ? larger : Math.round(larger * ratio);
            const h = aspectH >= aspectW ? larger : Math.round(larger / ratio);
            const error = Math.abs(w / h - ratio);
            if (error < best[2]) best = [w, h, error];
          }
          return [best[0], best[1]];
        }

        function fetchGallery(sidePx) {
          const nonce = Date.now() >>> 0;
          for (let idx = 0; idx < 12; idx++) {
            const offset = (nonce + idx) >>> 0;
            const [photoId, aspectW, aspectH] = NATURE_PHOTOS[offset % NATURE_PHOTOS.length];
            const [fetchW, fetchH] = fetchDimensions(aspectW, aspectH, sidePx);
            const url = `https://picsum.photos/id/${photoId}/${fetchW}/${fetchH}`;
            fetch(url)
              .then(res => {
                if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
                return res.arrayBuffer();
              })
              .then(buf => handle.setGalleryTileImage(idx, new Uint8Array(buf), photoId, aspectW, aspectH))
              .catch(err => console.warn(`gallery tile ${idx}: could not load ${url}:`, err));
          }
        }

        // Rust signals *when* to fetch the enlarged view via
        // handle.takePendingGalleryHiresFetch(), polled the same way.
        // Requests the *same* photo (same picsum id) at the actual
        // on-screen fitted size Rust computed. Kept cancellable via
        // AbortController: handle.takePendingGalleryHiresCancel() polled
        // the same way tells us the user backed out before this resolved.
        let galleryHiresController = null;

        function fetchGalleryHires(request) {
          galleryHiresController?.abort();
          const controller = new AbortController();
          galleryHiresController = controller;
          const url = `https://picsum.photos/id/${request.photo_id}/${request.width}/${request.height}`;
          fetch(url, { signal: controller.signal })
            .then(res => {
              if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
              return res.arrayBuffer();
            })
            .then(buf => handle.setGalleryHiresImage(request.tile_idx, new Uint8Array(buf)))
            .catch(err => {
              if (err.name !== 'AbortError') {
                console.warn(`gallery hires tile ${request.tile_idx}: could not load ${url}:`, err);
              }
            });
        }

        // ── The shim's own poll loop ─────────────────────────────────────
        //
        // Rust drives Engine::frame (tick/update/render) on its own
        // requestAnimationFrame loop inside proteus-host-web/WebLoop — this
        // loop only polls the M13.4-debt handle methods, at most one frame
        // out of step with Rust's own loop (both are rAF-driven, so in
        // practice the same vsync tick). Texture churn isn't one of these
        // anymore — DemoApp::update bakes it directly via Frame::bake_texture
        // now (M13.4 step 1), same as native.
        function pollShim() {
          const startTile = handle.takePendingVideoStart();
          if (startTile !== undefined) playHls(startTile);
          if (handle.takePendingVideoStop()) stopVideo();
          if (handle.takePendingVideoCancel()) hlsAbortController?.abort();

          const gallerySidePx = handle.takePendingGalleryFetch();
          if (gallerySidePx !== undefined) fetchGallery(gallerySidePx);

          const hiresRequest = handle.takePendingGalleryHiresFetch();
          if (hiresRequest !== undefined) fetchGalleryHires(hiresRequest);
          if (handle.takePendingGalleryHiresCancel()) galleryHiresController?.abort();

          requestAnimationFrame(pollShim);
        }
        requestAnimationFrame(pollShim);

      } catch (err) {
        console.error('Proteus init error:', err);
        status.textContent = `Error: ${err}`;
      }
    }

    main();
  </script>
</body>
</html>
