[package]
name = "proteus-shell-web"
description = "Layer 3: WebGL2/WebGPU WASM shell (reference demo)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# M13.4 step 4b: this crate collapsed to just DemoApp wiring — texture
# churn, the gallery, and now video (real <video>/MediaSource playback,
# moved into proteus-host-web's own hls_video module) all moved off the
# shell and onto the real Frame/HostServices contract. All platform glue
# (canvas/wgpu setup, rAF loop, DPI, resize, Pointer Events, visibility-
# pause, context-loss) already lived in proteus-host-web since M13.2.
proteus-demo = { path = "../proteus-demo" }
proteus-host-web = { path = "../proteus-host-web" }
proteus-runtime = { path = "../proteus-runtime" }
wasm-bindgen = { workspace = true }
# Not referenced by name in src/, but a real dependency of wasm-bindgen's own
# macro-generated glue for `async fn` exports (`start`) — confirmed by the
# pre-M13.2 shell hitting `cannot find module or crate` at the macro
# expansion site without it.
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
console_error_panic_hook = { workspace = true }
