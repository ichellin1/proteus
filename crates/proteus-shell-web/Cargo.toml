[package]
name = "proteus-shell-web"
description = "Runs the Proteus reference demo on a web page."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# The reference demo, which ships as a web page, not a crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Everything but the settings and the asset download lives elsewhere: the
# canvas, GPU, frame loop and input in proteus-host-web, and the demo itself
# in proteus-demo.
proteus-demo = { workspace = true }
proteus-host-web = { workspace = true }
proteus-runtime = { workspace = true }
wasm-bindgen = { workspace = true }
# Not referenced by name in src/, but the code wasm-bindgen generates for an
# `async fn` export (`start`) needs it; without it the build fails with
# "cannot find module or crate".
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
console_error_panic_hook = { workspace = true }
# The demo's HLS video player, src/video_player.rs: a <video> element fed
# through MediaSource, and canvas readback of each frame.
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlVideoElement", "HtmlMediaElement",
    "HtmlCanvasElement", "CssStyleDeclaration", "MediaSource", "MediaSourceReadyState",
    "SourceBuffer", "Url", "CanvasRenderingContext2d", "ImageData", "Node", "Event",
    "Request", "RequestInit", "Response", "AbortController", "AbortSignal",
] }
