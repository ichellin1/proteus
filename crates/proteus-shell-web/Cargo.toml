[package]
name = "proteus-shell-web"
description = "Layer 3: WebGL2/WebGPU WASM shell (reference demo)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# M13.2 collapse: all platform glue (canvas/wgpu setup, rAF loop, DPI,
# resize, Pointer Events, visibility-pause, context-loss) now lives in
# proteus-host-web; this crate is just DemoApp wiring + the M13.4-debt
# video/gallery/texture-churn shim (see src/lib.rs's crate doc) — the same
# role proteus-shell-native's main.rs plays for the native host.
proteus-demo = { path = "../proteus-demo" }
proteus-host-web = { path = "../proteus-host-web" }
proteus-render = { path = "../proteus-render" }
proteus-runtime = { path = "../proteus-runtime" }
wasm-bindgen = { workspace = true }
# Not referenced by name in src/, but a real dependency of wasm-bindgen's own
# macro-generated glue for `async fn` exports (`start`) — confirmed by the
# pre-M13.2 shell hitting `cannot find module or crate` at the macro
# expansion site without it.
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
console_error_panic_hook = { workspace = true }
