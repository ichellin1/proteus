[package]
name = "proteus-demo"
description = "The Proteus reference demo, written once and run natively and on the web."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# The reference demo, which ships as a web page, not a crate.
publish = false

[dependencies]
proteus-sdk = { workspace = true }
proteus-runtime = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
# The gallery's nonce (see gallery_fetch.rs) needs the current time, and
# std::time::SystemTime::now() panics on wasm32-unknown-unknown. web-time
# works on both: std::time natively, Performance and Date on wasm32. wgpu
# already depends on it, so it adds nothing to the build.
web-time = "1"

[dev-dependencies]
# For the tests in src/lib.rs, which inspect ECS components directly
# (`BakedImage`, `ActiveTransition`, `Virtual`, `VideoCrossfade` and so on)
# beyond what `Proteus::get`'s `ComponentData` exposes.
proteus-render = { workspace = true }
proteus-ui = { workspace = true }
bevy_ecs = { workspace = true }
