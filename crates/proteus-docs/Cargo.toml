[package]
name = "proteus-docs"
description = "Runs the Rust snippets in docs/ as doctests."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# What the guides' Rust snippets use.
proteus-sdk = { path = "../proteus-sdk" }
proteus-runtime = { path = "../proteus-runtime" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proteus-host-winit = { path = "../proteus-host-winit" }

# The snippets that use the web host, checked for wasm32; see build.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
proteus-host-web = { path = "../proteus-host-web" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window"] }
