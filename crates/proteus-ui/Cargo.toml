[package]
name = "proteus-ui"
description = "The Proteus component model and transition engine, built on bevy_ecs."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proteus-render = { path = "../proteus-render" }
bevy_ecs = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# SignalId, like proteus-render's TextureId, is a slotmap key.
slotmap = { workspace = true }

[dev-dependencies]
# Integration tests construct World and glam types directly, and reference
# QuadPipeline constants for UV sentinel assertions.
bevy_ecs = { workspace = true }
glam = { workspace = true }
proteus-render = { path = "../proteus-render" }
# wgpu and pollster: the GPU test for component baking (tests/static_bake.rs),
# set up as in proteus-render/tests/headless_render.rs.
wgpu = { workspace = true }
pollster = { workspace = true }
