[package]
name = "proteus-render"
description = "Proteus's GPU renderer: the instanced quad pipeline, its shader and the texture atlases."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parley = { workspace = true }
swash = { workspace = true }
etagere = { workspace = true }
bevy_ecs = { workspace = true }
image = { workspace = true }
slotmap = { workspace = true }

[features]
default = ["embedded-font"]
# Inter, embedded as the default font. Without it, an app gives its own; see
# the module docs of `text`.
embedded-font = []

[dev-dependencies]
# Fonts for the tests of fonts, weights, italics and fallback. Not published, so
# `cargo publish` leaves it out.
proteus-test-fonts = { path = "../proteus-test-fonts" }
# pollster: blocks on wgpu async init inside integration tests
pollster = { workspace = true }
# wgpu re-exported through proteus-render but needs explicit dev-dep for tests/
wgpu = { workspace = true }
