[package]
name = "proteus-runtime"
description = "Layer 2.75: Renderer + Engine + App/Host/HostServices contracts binding headless Proteus to a GPU surface (M13.1)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# proteus-sdk stays headless; this crate is the first layer that knows about
# the GPU surface. Hosts (proteus-host-winit, proteus-host-web) depend on
# this crate only — never on proteus-render / proteus-ui directly.
proteus-gpu = { path = "../proteus-gpu" }
proteus-sdk = { path = "../proteus-sdk" }
proteus-render = { path = "../proteus-render" }
proteus-ui = { path = "../proteus-ui" }
bevy_ecs = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# GPU-backed test for `Frame::play_video`/`stop_video`'s registry bookkeeping —
# same headless-device pattern `proteus-sdk`'s and `proteus-ui`'s own GPU tests
# use, skipped gracefully when no adapter is available.
pollster = { workspace = true }
