[workspace]
resolver = "2"

members = [
    "crates/proteus-gpu",
    "crates/proteus-render",
    "crates/proteus-ui",
    "crates/proteus-sdk",
    "crates/proteus-sdk-web",
    "crates/proteus-runtime",
    "crates/proteus-host-winit",
    "crates/proteus-host-web",
    "crates/proteus-demo",
    "crates/proteus-shell-web",
    "crates/proteus-shell-native",
]

# `cargo build`/`run`/`test`/`clippy` with no `-p`/`--workspace` operate on
# these by default, not literally every member — proteus-shell-web can
# never compile for a host target (wgpu::SurfaceTarget::Canvas is
# #[cfg(web)]-gated) and pulling it into a plain `cargo run` at the
# workspace root fails the whole build before it ever gets far enough to
# notice proteus-shell-native's own `proteus` binary is the one (and only)
# runnable target in this list — see scripts/git-hooks/pre-push, Makefile,
# and .github/workflows/ci.yml for the same exclusion applied to clippy/
# test, plus the wasm32-targeted build/clippy proteus-shell-web still gets
# there instead.
default-members = [
    "crates/proteus-gpu",
    "crates/proteus-render",
    "crates/proteus-ui",
    "crates/proteus-sdk",
    "crates/proteus-sdk-web",
    "crates/proteus-runtime",
    "crates/proteus-host-winit",
    "crates/proteus-demo",
    "crates/proteus-shell-native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Blue <isaac.chellin@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ichellin1/proteus"

[workspace.dependencies]
# GPU
# "webgl" is required for the WebGL2 backend on wasm — without it, web builds are WebGPU-only
wgpu = { version = "29", features = ["wgsl", "webgl"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
etagere = "0.3"  # shelf-based 2D atlas packing (used by TextureRegistry)
fontdue = "0.8"  # pure-Rust font rasterization — no system font dependencies
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }  # static image decode (M9.7) — pure Rust, works on native and wasm32

# ECS
bevy_ecs = "0.18"  # standalone ECS runtime — does not pull in the full Bevy engine
slotmap = "1"      # O(1) stable-key storage with generation safety (TextureRegistry, SignalRegistry)

# Async / Runtime
pollster = "0.4"   # native-only: blocks on wgpu async init — not used on wasm

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"  # JsValue <-> Rust deserialization at the WASM boundary

# Logging
log = "0.4"
env_logger = "0.11"   # native logging backend
wasm-logger = "0.2"   # wasm logging backend — routes log:: macros to console.log

# WASM
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }  # future::join_all for PreloadedHostServices' concurrent fetches
console_error_panic_hook = "0.1"  # routes Rust panics to console.error on wasm

# Native windowing
winit = "0.30"

# Error handling
thiserror = "2"
anyhow = "1"
