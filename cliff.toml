# git-cliff's settings: how CHANGELOG.md is generated from the commit history.
# CHANGELOG.md is never edited by hand; scripts/version.mjs regenerates it.
# Commits follow Conventional Commits; see CONTRIBUTING.md.

[changelog]
header = """
# Changelog

The changes in each version of Proteus. This file is generated from the commit history; see
RELEASING.md.
"""
# Each version's section. Version 0.1.0 opens with a summary of everything in
# it: the work before it didn't use Conventional Commits, so the list below
# the summary only covers the work that prepared the release. Versions 0.2.0
# and 0.3.0 open with what to change when upgrading. The blank line first separates it
# from the one before: git-cliff trims the header's.
body = """

{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}
{% if version == "v0.1.0" %}
The first release of Proteus.

- **Components:** shapes with a position, size, rotation, scale, color and corner radius, with
  borders, drop shadows and glows; children placed relative to their parent; and baking, which
  draws a component and its children as one image.
- **Transitions:** a component moving to new geometry, one component turning into another
  through a transition channel (1→1), a split into several (1→N) and a merge of several into
  one (N→1), with built-in easing curves and any cubic Bézier.
- **Interaction:** pointer events, and hover, pressed, focused and disabled styles, with hit
  testing that follows rotation and drawing order.
- **Content:** a line of text in the app's font, images and textures in a texture atlas that
  makes room for new ones as needed, and video from the app's own player (experimental).
- **Hosts:** a native host, for macOS, Windows and Linux, and a web host, with WebGPU or
  WebGL2. Apps are written in Rust, or in TypeScript with the `proteus-sdk` npm package.
- **Documentation:** getting-started guides, concept guides and how-tos, in Rust and
  TypeScript; an API reference; and examples in both languages.

The changes below were made while preparing this release.
{% endif %}
{%- if version == "v0.2.0" %}
### Upgrading from 0.1

Most apps need no changes: the API apps use is the same in both SDKs.

- **Config structs written out in full** no longer compile in Rust: `frame.skip_idle_frames`,
  `render.plain_pipeline`, `render.skip_covered_pixels` and `resources.max_bake_scale` are new,
  each on by default. Fill in the rest with `..Default::default()`. TypeScript's config is
  unchanged, since every setting is optional there.
- **Custom hosts that build instances:** `proteus_render::QuadInstance` has a radius per corner,
  `corner_radii`, in place of `corner_radius`. Set it with `set_corner_radius` or
  `set_corner_radii`.
- **A still screen isn't drawn:** `update` still runs every frame, but when nothing changed the
  GPU draws nothing. Set `frame.skip_idle_frames` to `false` to draw every frame, as 0.1 did.
- **Text and baked components are baked at the display's resolution,** up to twice the logical
  size, so they take up to four times the atlas space on high-density displays. An app that
  filled its atlas in 0.1 can lower `resources.max_bake_scale`, or raise its memory.
- **A corner radius past half the shorter side draws as half,** as in CSS, so a short, wide
  component with a large radius is a pill. In 0.1 the shape shrank instead.
{% endif %}
{%- if version == "v0.3.0" %}
### Upgrading from 0.2

- **TypeScript apps built against this repository's SDK,** as the examples are, need it built
  again: run `make build-sdk-web` before `npm install`. The SDK from npm needs nothing.
- **`InputConfig` written out in full** no longer compiles in Rust: `input.autofocus` is new,
  off by default. Fill in the rest with `..Default::default()`.
- **The web canvas can take keyboard focus:** the host gives it `tabindex="0"` unless the page
  set one, so a click focuses it, and a browser may outline it while it has focus.
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{%- endfor %}
"""
trim = false
footer = ""
# The template's tags leave stray blank lines: keep one between blocks, and
# drop them at the end, where git-cliff adds the file's final newline.
postprocessors = [
    { pattern = "\n{3,}", replace = "\n\n" },
    { pattern = "\n+$", replace = "" },
]

[git]
conventional_commits = true
# Commits that don't follow Conventional Commits are left out.
filter_unconventional = true
split_commits = false
# Only commits that one of `commit_parsers` puts in a group are listed. Older
# commits such as `PLANNING: …` look conventional but aren't.
filter_commits = true
# Internal step names, from the developer release's plan, aren't changes a
# user of Proteus would know.
commit_preprocessors = [
    { pattern = " \\(step [0-9][a-z]?\\)", replace = "" },
    { pattern = ",? and close out step [0-9]+", replace = "" },
    # v0.2.0: a subject starting with a function's name, which the template
    # would capitalize.
    { pattern = "^feat\\(sdk\\): top_left_to_world and world_to_top_left in Rust", replace = "feat(sdk): Rust's top_left_to_world and world_to_top_left" },
    # v0.2.0: changes that break existing code, which their commits didn't
    # mark; the template's upgrading notes for v0.2.0 say what to change.
    # `QuadInstance` has a radius per corner, and four config structs have new
    # fields.
    { pattern = "^(perf\\(render\\)): (redo and upload only the components that changed)", replace = "$1!: $2" },
    { pattern = "^(feat\\(runtime\\)): (skip drawing frames that didn't change)", replace = "$1!: $2" },
    { pattern = "^(perf\\(render\\)): (draw plain components with a pipeline of their own)", replace = "$1!: $2" },
    { pattern = "^(perf\\(render\\)): (skip pixels a later opaque component covers)", replace = "$1!: $2" },
    { pattern = "^(feat\\(render\\)): (bake text and components at the display's resolution)", replace = "$1!: $2" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# The `<!-- n -->` comments order the groups; the template strips them.
commit_parsers = [
    # Before the developer release: covered by 0.1.0's summary.
    { sha = "455787c0d05494c0fce10d91a7dedcaafec9ae02", skip = true },
    { sha = "4261af436438421e4af6fd2825a72b9d61509acd", skip = true },
    { sha = "0b418355d4f6600805ef34500a404b81122dea8c", skip = true },
    { sha = "2ba97056c0b69a489f6323e1ac096c90c026deff", skip = true },
    { sha = "6c17c4d31bfb60a4a2a13c9f65cac56bc3d04704", skip = true },
    # The project's own planning notes, not part of what it ships.
    { message = "^docs\\(planning\\)", skip = true },
    { sha = "12bc867023f3a4a3c16957c94f235f9fd002d7ec", skip = true },
    { sha = "6d33b67dd510e6e4868d5c76498ba7f6bf3d7c60", skip = true },
    # v0.2.0's planning notes, committed as plain `docs`.
    { sha = "c5bce1f40e453e3cb9a1f0c6aeb2a8e0d55ac75f", skip = true },
    { sha = "36c2d8753c822eabab26bf934d62068d224659fe", skip = true },
    # Fixes for bugs v0.2.0's own work introduced, which never shipped.
    { sha = "7d5b62e6b7f0fe10688c807145fc3a3263319a06", skip = true },
    { sha = "2a7d9934ba941e7b1293b8d2899244be0e950e07", skip = true },
    # A clip of the demo, added to the README and then removed again.
    { sha = "151456cbfd69ed7dd85f8025084ee0390e1cda0d", skip = true },
    { sha = "3121b9afe65bafbbc54dc3ac1b607a51f1d56d63", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^docs: close out step", skip = true },
    # The release commit, which only sets the version.
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changes" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(build|ci)", group = "<!-- 5 -->Build and release" },
    { message = "^chore", group = "<!-- 5 -->Build and release" },
    { message = "^(test|style)", skip = true },
]
