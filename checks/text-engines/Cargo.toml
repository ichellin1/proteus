[package]
name = "text-engines"
description = "Lays out and rasterizes the same text with fontdue's layout, cosmic-text and parley, for v0.4.0's choice of text engine. Not part of the workspace."
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, so its engines stay out of Proteus's Cargo.lock,
# builds and CI.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["fontdue", "cosmic", "parley", "all-fonts"]
fontdue = ["dep:fontdue"]
cosmic = ["dep:cosmic-text", "dep:swash", "dep:unicode-script"]
parley = ["dep:parley", "dep:swash"]
# Variable Inter, Inter Italic and Noto Sans Devanagari, from `fonts/`.
# Without it, only today's Inter Bold: what the wasm size builds use.
all-fonts = []
# The browser and Node timings, through wasm-bindgen.
bench = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
fontdue = { version = "0.9.5", optional = true }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"], optional = true }
parley = { version = "0.13.0", default-features = false, features = ["std"], optional = true }
swash = { version = "0.2.10", optional = true }
# The type in cosmic-text's `Fallback` trait, which it doesn't re-export.
unicode-script = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Today's text, to compare against.
proteus-render = { path = "../../crates/proteus-render" }
png = "0.17"

[profile.release]
# As the Proteus workspace builds its release.
debug = false
