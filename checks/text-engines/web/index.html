<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text engine timings</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
</style>
<h1>Text engine timings</h1>
<p>Lays out and rasterizes the same text with fontdue's layout, cosmic-text and parley, in
WebAssembly. Takes about a minute; the page doesn't respond until it's done. Copy the table and
send it with your browser, its version and your machine.</p>
<p id="status">Running…</p>
<pre id="out"></pre>
<script type="module">
  import init, { run_timings } from "./pkg/text_engines.js";
  await init();
  // Let the status paint before the long run.
  await new Promise((r) => setTimeout(r, 50));
  const table = run_timings(30);
  document.getElementById("out").textContent =
    navigator.userAgent + "\n\n" + table;
  document.getElementById("status").textContent = "Done.";
</script>
</html>
