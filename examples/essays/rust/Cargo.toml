[package]
name = "essays"
description = "A reading app with wrapped and truncated text, built with Proteus, in Rust: the same app as the TypeScript essays example."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `cdylib` is for the web build, and the `rlib` is for the native binary in
# src/main.rs.
crate-type = ["cdylib", "rlib"]

[dependencies]
proteus-sdk = { workspace = true }
proteus-runtime = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proteus-host-winit = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
proteus-host-web = { workspace = true }
wasm-bindgen = { workspace = true }
# The code wasm-bindgen generates for the `async fn start` export needs this
# crate.
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
