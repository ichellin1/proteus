<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141419;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <script type="module">
      import init, { start } from "./pkg/video.js";
      await init();
      // The reference demo's video. The page is served from the repository's
      // root, so it can reach it.
      await start("app", "../../../crates/proteus-shell-native/assets/videos/tiger.mp4");
    </script>
  </body>
</html>
