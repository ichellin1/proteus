[package]
name = "stepper"
description = "An onboarding flow whose steps transform into one another, built with Proteus, in Rust: the same app as the TypeScript stepper."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `cdylib` for the web build, `rlib` for the native binary in src/main.rs.
crate-type = ["cdylib", "rlib"]

[dependencies]
proteus-sdk = { workspace = true }
proteus-runtime = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proteus-host-winit = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
proteus-host-web = { workspace = true }
wasm-bindgen = { workspace = true }
# The code wasm-bindgen generates for the `async fn start` export needs it.
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
wasm-logger = { workspace = true }
