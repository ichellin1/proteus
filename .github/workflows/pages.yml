name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    # `crates/**`, not a hand-maintained list of the crates the web demo
    # happens to depend on today. That list was written pre-M13, when the
    # demo was `proteus-shell-web` on top of `proteus-gpu`/`render`/`ui`;
    # since M12.5/M13 the deployed build also pulls in `proteus-demo` (where
    # every line of demo logic now lives), `proteus-runtime`,
    # `proteus-host-web`, `proteus-sdk` and `proteus-sdk-web` — none of which
    # were listed, so a change to any of them silently never redeployed.
    # A workspace-wide filter can't drift that way; the cost is an occasional
    # no-op rebuild for a native-only change. `Cargo.toml`/`Cargo.lock` are
    # included because a dependency bump changes the shipped wasm too.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-pack binary
        uses: actions/cache@v4
        id: cache-wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ubuntu-wasm-pack-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (web shell)
        run: wasm-pack build crates/proteus-shell-web --target web --out-dir www/pkg

      - name: Disable Jekyll processing
        run: touch crates/proteus-shell-web/www/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/proteus-shell-web/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
