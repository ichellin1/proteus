name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install software GPU (headless render test)
        # lavapipe is Mesa's CPU-based Vulkan implementation — gives wgpu a
        # real adapter on the GitHub Actions Ubuntu runner (no hardware GPU).
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # proteus-shell-web / proteus-host-web are wasm32-only
        # (wgpu::SurfaceTarget::Canvas is #[cfg(web)]-gated) — neither can
        # compile for this job's host target, so both are excluded here and
        # clippy-checked against wasm32 in the `wasm` job below instead.
        run: cargo clippy --workspace --exclude proteus-shell-web --exclude proteus-host-web --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --exclude proteus-shell-web --exclude proteus-host-web
        env:
          # Force wgpu to use the Vulkan backend so it picks up lavapipe.
          WGPU_BACKEND: vulkan
          # Fail the headless render test if no GPU adapter is found.
          # On CI lavapipe always provides one; this catches broken driver installs.
          REQUIRE_GPU: 1

  wasm:
    # WASM output is platform-independent — one Ubuntu build is sufficient.
    # macOS and Windows runners would produce identical .wasm bytes at 3× the cost.
    name: WASM build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-pack binary
        uses: actions/cache@v4
        id: cache-wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ubuntu-wasm-pack-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Clippy (proteus-shell-web + proteus-host-web, wasm32)
        run: cargo clippy -p proteus-shell-web -p proteus-host-web --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings

      - name: wasm-pack build (web shell)
        run: wasm-pack build crates/proteus-shell-web --target web

  sdk-web:
    # Separate from the `wasm` job above on purpose: proteus-sdk-web builds
    # with --target bundler (an npm-installable package for bundler-based
    # projects), not --target web (proteus-shell-web's zero-build-step demo
    # page) — keeping the jobs apart keeps that distinction visible and
    # keeps shell-web's build independent of the TS toolchain.
    name: SDK (wasm + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Cache wasm-pack binary
        uses: actions/cache@v4
        id: cache-wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ubuntu-wasm-pack-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: wasm-pack build (proteus-sdk-web)
        run: wasm-pack build crates/proteus-sdk-web --target bundler --out-dir ts/pkg

      - name: wasm-pack build (proteus-host-web)
        # M13.2: the ts/ package's mount() wrapper needs this crate's own
        # wasm-pack output (ts/pkg-host) alongside proteus-sdk-web's own
        # (ts/pkg) — see PLANNING.md's M13.2 section for why bundling both
        # into one npm package is sound despite being two separate wasm
        # binaries.
        run: wasm-pack build crates/proteus-host-web --target bundler --out-dir ../proteus-sdk-web/ts/pkg-host

      - name: Install Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/proteus-sdk-web/ts/package-lock.json

      - name: npm install
        working-directory: crates/proteus-sdk-web/ts
        run: npm ci

      - name: Type-check
        working-directory: crates/proteus-sdk-web/ts
        run: npx tsc --noEmit

      - name: Build TypeScript (dist/)
        # examples/gallery depends on this package via `file:`, resolving
        # its `main`/`types` into dist/ — it needs this built, not just
        # type-checked, before that example's own npm install/type-check
        # below can succeed.
        working-directory: crates/proteus-sdk-web/ts
        run: npm run build

      - name: Verify the package is in a publishable shape
        working-directory: crates/proteus-sdk-web/ts
        run: npm pack --dry-run

      - name: examples/gallery — npm install
        working-directory: examples/gallery
        run: npm ci

      - name: examples/gallery — type-check
        working-directory: examples/gallery
        run: npx tsc --noEmit
