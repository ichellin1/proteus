name: Release

# A tag such as `v0.2.0` releases that version: it checks that every crate and
# package has that version, runs CI, publishes the crates to crates.io and the
# TypeScript SDK to npm, and creates the GitHub Release with that version's
# section of CHANGELOG.md as its notes. See RELEASING.md.
#
# Run by hand from the Actions tab, it is a dry run of the same steps: nothing
# is published (`--dry-run`), and the GitHub Release is a draft, to delete
# once checked.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to dry-run, such as 0.2.0. CHANGELOG.md must have its section."
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Run by hand, nothing is published.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$DRY_RUN" = true ]; then version="$INPUT"; else version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (dry run: $DRY_RUN)"

      - name: Every crate and package has it
        run: node scripts/version.mjs check "${{ steps.version.outputs.version }}"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  crates:
    name: Publish to crates.io
    needs: [version, ci]
    runs-on: ubuntu-latest
    # A real release waits here for approval: the `release` environment
    # requires a reviewer (repository Settings → Environments). Its name can
    # also limit trusted publishing to this job. A dry run uses an
    # environment with no protection, so it doesn't wait.
    environment: ${{ github.event_name == 'push' && 'release' || 'dry-run' }}
    permissions:
      contents: read
      # Trusted publishing: crates.io trusts this workflow through GitHub's
      # OIDC token, so no long-lived token is stored.
      id-token: write
    env:
      # Only for a crate's first publish, before trusted publishing can be
      # linked to it; see RELEASING.md. Unset otherwise.
      FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Authenticate to crates.io
        id: auth
        if: env.DRY_RUN != 'true' && env.FIRST_PUBLISH_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1

      # proteus-host-web only builds for wasm32, so it's published on its own,
      # for that target, once the crates it depends on are on crates.io. A dry
      # run can't wait for them, so it checks the workspace for wasm32 instead.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.FIRST_PUBLISH_TOKEN || steps.auth.outputs.token }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            cargo publish --workspace --dry-run --exclude proteus-host-web
            cargo publish --workspace --dry-run --exclude proteus-host-winit --target wasm32-unknown-unknown
          else
            cargo publish --workspace --exclude proteus-host-web
            cargo publish -p proteus-host-web --target wasm32-unknown-unknown
          fi

  npm:
    name: Publish to npm
    needs: [version, ci]
    runs-on: ubuntu-latest
    # A real release waits here for approval: the `release` environment
    # requires a reviewer (repository Settings → Environments). Its name can
    # also limit trusted publishing to this job. A dry run uses an
    # environment with no protection, so it doesn't wait.
    environment: ${{ github.event_name == 'push' && 'release' || 'dry-run' }}
    permissions:
      contents: read
      # Trusted publishing, as for crates.io, and provenance for the package.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build the WebAssembly
        run: |
          wasm-pack build crates/proteus-sdk-web --release --target bundler --out-dir ts/pkg
          wasm-pack build crates/proteus-host-web --release --target bundler \
            --out-dir ../proteus-sdk-web/ts/pkg-host

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install --global npm@11

      - name: Build the package
        working-directory: crates/proteus-sdk-web/ts
        run: |
          npm ci
          npm run build

      - name: Publish
        working-directory: crates/proteus-sdk-web/ts
        env:
          # Only for the package's first publish, before trusted publishing
          # can be linked to it; see RELEASING.md. Unset otherwise, and npm
          # uses trusted publishing.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Without the secret, npm publishes through trusted publishing; an
          # empty token would be sent instead.
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          if [ "$DRY_RUN" = true ]; then
            npm publish --access public --loglevel verbose --dry-run
          else
            npm publish --access public --loglevel verbose
          fi

  github-release:
    name: Create the GitHub Release
    needs: [version, crates, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The version's section, from its heading to the next version's.
          awk -v heading="## $VERSION (" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            # A draft makes no tag. Run again, it updates the draft.
            if gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
              gh release edit "v$VERSION" --notes-file notes.md
            else
              gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
                --title "v$VERSION" --notes-file notes.md
            fi
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
          fi
